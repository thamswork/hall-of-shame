<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หนอนหัวกระสุน | Hall of Shame</title>
    <!-- Importing Noto Sans Thai -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --accent-green: #27ae60;
            --accent-red: #e74c3c;
            --border: #e1e8ed;
            --font-thai: 'Noto Sans Thai', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-thai);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            margin-top: 2rem;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 3.5rem; 
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .header h1 span {
            color: var(--accent-red);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .board-container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 1.4rem;
            transition: background 0.2s ease;
        }

        .row:last-child {
            border-bottom: none;
        }

        .rank { 
            width: 40px; 
            color: var(--text-muted); 
            font-size: 1.2rem;
            font-weight: 700;
        }

        .name { 
            flex-grow: 1; 
            font-weight: 700; 
            text-transform: uppercase;
            color: var(--text-main);
        }

        .score { 
            color: var(--text-main); 
            font-weight: 800; 
            font-size: 1.4rem;
            background: var(--bg);
            padding: 0.4rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        /* Special styling for the #1 offender */
        .row.rank-1 .name { 
            color: var(--accent-red); 
        }
        .row.rank-1 .rank { 
            color: var(--accent-red); 
        }
        .row.rank-1 .score {
            color: white;
            background: var(--accent-red);
            border-color: var(--accent-red);
        }

        .loading { 
            text-align: center; 
            color: var(--text-muted); 
            font-style: italic; 
            padding: 2rem;
            font-weight: 700;
        }
        
        .footer { 
            margin-top: auto; 
            padding-top: 3rem;
            font-size: 0.8rem; 
            color: var(--text-muted); 
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🪱 หนอนหัว<span>กระสุน</span></h1>
        <p>Live Office Hall of Shame</p>
    </div>

    <div class="board-container" id="leaderboard">
        <div class="loading">กำลังเชื่อมต่อฐานข้อมูล...</div>
    </div>

    <div class="footer">
        SYSTEM AUTO-REFRESHES EVERY 30 SECONDS
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwEgjaUojKyKjg1LOUvpypPgNwhivOPFn9G1kjHQX9C9kUo7F7R-b1Hnx7aBsix_kgB/exec';
        
        async function fetchLeaderboard() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('leaderboard').innerHTML = `<div class="loading" style="color: var(--accent-red);">API ERROR: ${data.error}</div>`;
                    return;
                }
                
                renderBoard(data.leaderboard);
            } catch (error) {
                document.getElementById('leaderboard').innerHTML = '<div class="loading" style="color: var(--accent-red);">ERROR: CONNECTION LOST</div>';
            }
        }

        function renderBoard(data) {
            const container = document.getElementById('leaderboard');
            container.innerHTML = ''; 
            
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="loading">ยังไม่มีใครโดนประจานเลย (ออฟฟิศนี้คนดีเกินไป)</div>';
                return;
            }

            data.forEach((player, index) => {
                const rank = index + 1;
                const row = document.createElement('div');
                row.className = `row rank-${rank}`;
                
                row.innerHTML = `
                    <div class="rank">#${rank}</div>
                    <div class="name">${player.name}</div>
                    <div class="score">${player.score}</div>
                `;
                
                container.appendChild(row);
            });
        }

        fetchLeaderboard();
        setInterval(fetchLeaderboard, 30000);
    </script>
</body>
</html>
