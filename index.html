<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หนอนหัวกระสุน | Report System</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EAECEF;
            --surface: #FFFFFF;
            --text-main: #333333;
            --text-muted: #888888;
            --primary: #73CBB4; /* KhunThong Mint */
            --danger: #D9534F;
            --border: #F0F0F0;
            --font-thai: 'Noto Sans Thai', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-thai);
            margin: 0;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 2.5rem; 
            margin: 0 0 5px 0;
            font-weight: 800;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            margin: 0;
        }

        /* --- THE REPORT CARD --- */
        .card {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .report-btn {
            background-color: var(--bg);
            border: 1px solid #ddd;
            color: var(--text-main);
            padding: 12px;
            border-radius: 12px;
            font-family: var(--font-thai);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .report-btn:hover {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .report-btn:active {
            transform: scale(0.96);
        }

        /* --- LEADERBOARD CARD --- */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 1.1rem;
        }

        .row:last-child { border-bottom: none; }

        .rank { 
            width: 30px; 
            color: var(--text-muted); 
            font-weight: 800;
        }

        .name { 
            flex-grow: 1; 
            font-weight: 600; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
        }

        .score { 
            font-weight: 800; 
            color: var(--danger);
            background: #FDF2F2;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 1.1rem;
        }

        .loading { 
            text-align: center; 
            color: var(--text-muted); 
            padding: 1rem;
            font-size: 0.9rem;
        }

        #notification {
            display: none;
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(115, 203, 180, 0.4);
            animation: popIn 0.3s ease-out forwards;
        }

        @keyframes popIn {
            0% { transform: translateY(-10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🪱 หนอนหัวกระสุน</h1>
        <p>SECURE OFFICE REPORTING SYSTEM</p>
    </div>

    <div id="notification">✅ ประจานสำเร็จ! ส่งแจ้งเตือนเข้ากลุ่มแล้ว</div>

    <div class="card">
        <div class="card-title">
            🚨 แจ้งจับคนปากแจ๋ว
        </div>
        <div class="user-grid" id="user-buttons">
            <div class="loading">กำลังดึงรายชื่อ...</div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            🏆 Hall of Shame
        </div>
        <div id="leaderboard">
            <div class="loading">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <script>
        // Replace this with your newly deployed Web App URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbwEgjaUojKyKjg1LOUvpypPgNwhivOPFn9G1kjHQX9C9kUo7F7R-b1Hnx7aBsix_kgB/exec';
        
        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('leaderboard').innerHTML = `<div class="loading" style="color: red;">ERROR: ${data.error}</div>`;
                    return;
                }
                
                renderUsers(data.users);
                renderBoard(data.leaderboard);
            } catch (error) {
                console.error("Fetch error", error);
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('user-buttons');
            container.innerHTML = ''; 
            
            if (!users || users.length === 0) {
                container.innerHTML = '<div class="loading">ไม่พบรายชื่อใน Sheet Users</div>';
                return;
            }

            users.forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'report-btn';
                btn.innerText = `👉 ${name}`;
                btn.onclick = () => reportUser(name, btn);
                container.appendChild(btn);
            });
        }

        function renderBoard(leaderboard) {
            const container = document.getElementById('leaderboard');
            container.innerHTML = ''; 
            
            if (!leaderboard || leaderboard.length === 0) {
                container.innerHTML = '<div class="loading">ยังไม่มีคนโดนประจาน</div>';
                return;
            }

            leaderboard.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = `
                    <div class="rank">${index + 1}.</div>
                    <div class="name">${player.name}</div>
                    <div class="score">${player.score}</div>
                `;
                container.appendChild(row);
            });
        }

        async function reportUser(name, btnElement) {
            // Visual feedback
            const originalText = btnElement.innerText;
            btnElement.innerText = 'กำลังส่ง...';
            btnElement.style.pointerEvents = 'none';
            btnElement.style.opacity = '0.7';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'snitch', sinner: name })
                });
                
                const result = await response.json();
                
                if(result.status === 'success') {
                    showNotification();
                    fetchData(); // Refresh the board instantly
                }
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
            } finally {
                // Reset button
                btnElement.innerText = originalText;
                btnElement.style.pointerEvents = 'auto';
                btnElement.style.opacity = '1';
            }
        }

        function showNotification() {
            const notif = document.getElementById('notification');
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 3000);
        }

        // Run on load and refresh every 30s
        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
